<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Concurrent 3280 &mdash; OS/32</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root{
    --amber:#ffb838; --bg:#0b0a08; --bar:#16130d;
    --key-ink:#f0e2c4; --key-line:#3a3324; --go:#d7a94e; --accent:#123a6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);
    font-family:"Oswald","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
    touch-action:none;cursor:none}
  body{display:flex;flex-direction:column}

  .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:10px 16px;background:var(--bar);border-bottom:1px solid #2a2417}
  .bar .id{display:flex;flex-direction:column;line-height:1.15}
  .bar .id b{color:var(--amber);font-size:16px;letter-spacing:.02em;font-weight:600}
  .bar .id span{color:#8c805f;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
  .back{border:1px solid var(--key-line);background:#241f16;color:var(--key-ink);
    font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 14px;border-radius:8px}
  .back:active{background:#2f2819}
  .status{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f6547}
  .status.on{color:var(--go)}

  #term{flex:1 1 auto;min-height:0;background:#000;padding:8px 8px 2px}
  .xterm{height:100%}

  /* tappable command hints */
  .hints{flex:0 0 auto;display:flex;gap:7px;align-items:center;overflow-x:auto;
    padding:8px 12px;background:#100e09;border-top:1px solid #241f14;scrollbar-width:none}
  .hints::-webkit-scrollbar{display:none}
  .hints .lbl{flex:0 0 auto;color:#7d7358;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .chip{flex:0 0 auto;border:1px solid #3a3324;background:#1d1810;color:#e9d9b4;
    font-family:"Space Mono",ui-monospace,monospace;font-size:14px;padding:8px 13px;border-radius:20px;
    white-space:nowrap}
  .chip:active{background:var(--go);color:#1a1408;border-color:var(--go)}
  .chip.demo{border-color:var(--accent);background:#12233d;color:#bcd4f2}
  .chip.demo:active{background:#2f6bd6;color:#fff}

  .kbd{flex:0 0 auto;background:var(--bar);border-top:1px solid #2a2417;
    padding:6px clamp(4px,1vw,10px) calc(6px + env(safe-area-inset-bottom));display:flex;
    flex-direction:column;gap:5px}
  .krow{display:flex;gap:5px}
  .k{flex:1 1 0;min-width:0;height:clamp(40px,7vh,58px);border:1px solid var(--key-line);
    background:linear-gradient(#282112,#211b10);color:var(--key-ink);border-radius:8px;
    font-family:"Space Mono",ui-monospace,monospace;font-size:clamp(15px,2.5vh,21px);font-weight:700;
    display:flex;align-items:center;justify-content:center;position:relative;padding:0}
  .k:active,.k.hold{background:linear-gradient(var(--go),#b98a2e);color:#1a1408;border-color:var(--go)}
  .k .sup{position:absolute;top:3px;right:7px;font-size:.6em;color:#8c805f;font-weight:400}
  .k:active .sup,.k.hold .sup{color:#3a2c08}
  .k.mod{background:linear-gradient(#20242c,#171a20);color:#bcd0e6;font-size:clamp(12px,1.9vh,15px);
    letter-spacing:.04em;flex:1.6 1 0}
  .k.mod.on{background:linear-gradient(var(--go),#b98a2e);color:#1a1408}
  .k.bksp{flex:1.7 1 0} .k.ret{flex:1.9 1 0;background:linear-gradient(#1d2a1d,#152015);color:#a9e0a9}
  .k.space{flex:7 1 0}

  /* ---- guided lessons: a card between the terminal and the hints ---- */
  .lesson{flex:0 0 auto;display:none;flex-direction:column;gap:10px;
    background:#f3ecda;color:#1a1408;border-top:4px solid var(--go);padding:14px 18px 12px}
  .lesson.open{display:flex}
  .lesson .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .lesson .top .ttl{font-size:22px;font-weight:600;letter-spacing:.01em}
  .lesson .top .pos{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7a6c48}
  .lesson .say{font-family:"Archivo","Segoe UI",system-ui,sans-serif;font-size:21px;line-height:1.3;
    font-weight:500;color:#1a1408;min-height:2.6em}
  .lesson .say b{color:var(--accent)}
  .lesson .code{font-family:"Space Mono",ui-monospace,monospace;font-size:15px;line-height:1.35;
    background:#0b0a08;color:var(--amber);border-radius:8px;padding:10px 14px;white-space:pre;
    overflow-x:auto;max-height:150px;overflow-y:auto}
  .lesson .row{display:flex;gap:10px;align-items:stretch}
  .lesson .btn{border:1px solid #b8a06a;background:#e6dcc2;color:#1a1408;font-family:inherit;
    font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:12px 16px;
    border-radius:10px;min-width:96px}
  .lesson .btn:active{background:#d7c9a4}
  .lesson .btn.go{flex:1 1 auto;background:var(--accent);color:#fff;border-color:var(--accent);
    font-size:19px;letter-spacing:.04em;text-transform:none}
  .lesson .btn.go:active{background:#2f6bd6}
  .lesson .btn.go.done{background:#2b5a2b;border-color:#2b5a2b}
  .lesson .btn.go.busy{background:#5a4a1e;border-color:#5a4a1e;color:#f3ecda}
  .lesson .btn[disabled]{opacity:.45}
  .lesson .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lesson .menu .btn{text-transform:none;font-size:18px;padding:16px 14px;text-align:left;line-height:1.2}
  .lesson .menu .btn small{display:block;font-weight:400;font-size:13px;color:#5d5237;margin-top:3px;letter-spacing:0}
  .back.lessons{background:var(--go);color:#1a1408;border-color:var(--go)}
</style>
</head>
<body>
  <div class="bar">
    <div class="id"><b>Perkin&#8209;Elmer OS/32</b><span>Concurrent 3280 &middot; live emulation</span></div>
    <div class="status" id="status">connecting&hellip;</div>
    <button class="back lessons" id="lessons" style="margin-right:8px">&#9998;&nbsp;Lessons</button>
    <button class="back" id="restart" style="margin-right:8px">&#8635;&nbsp;Restart</button>
    <button class="back" id="back">&#8592;&nbsp;Exhibit</button>
  </div>

  <div id="term"></div>

  <!-- guided lessons: each step explains one thing and can type it for you -->
  <div class="lesson" id="lesson">
    <div class="top"><span class="ttl" id="l-title">Lessons</span><span class="pos" id="l-pos"></span></div>
    <div id="l-body"></div>
  </div>

  <div class="hints" id="hints">
    <span class="lbl">Try&nbsp;tapping:</span>
    <button class="chip" data-cmd="display files">display files</button>
    <button class="chip" data-cmd="display time">display time</button>
    <button class="chip" data-cmd="help *">help *</button>
    <span class="lbl" style="margin-left:4px">run a program:</span>
    <button class="chip demo" data-cmd="forclg hellof">&#9654;&nbsp;Fortran</button>
    <button class="chip demo" data-cmd="pasclg hellop">&#9654;&nbsp;Pascal</button>
    <button class="chip demo" data-cmd="cc helloc">&#9654;&nbsp;C</button>
  </div>

  <div class="kbd" id="kbd"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script>
  const term = new Terminal({
    cursorBlink:true, fontFamily:'"Space Mono", ui-monospace, monospace',
    fontSize:18, lineHeight:1.05, scrollback:800, convertEol:false,
    theme:{ background:'#000000', foreground:'#ffb838', cursor:'#ffb838',
            selectionBackground:'#5a4a1e' }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit); term.open(document.getElementById('term')); fit.fit();
  addEventListener('resize', ()=>{ try{fit.fit();}catch(e){} });

  // ---- websocket to the OS/32 bridge ----
  const statusEl = document.getElementById('status');
  // A fresh username per session. MTM needs usernames to be unique across
  // signed-on lines; three fixed names ran out as soon as a few sessions were
  // abandoned. The account (25) and password are what actually authenticate.
  const newUser = ()=>'V'+Math.random().toString(36).slice(2,7).toUpperCase().replace(/[^A-Z0-9]/g,'X');
  let ws, user=newUser(), signonTries=0, manualClose=false;

  // Follow the output. xterm only auto-scrolls when the viewport is already at
  // the bottom, and the lesson card resizing the terminal leaves it elsewhere.
  // So: snap to the bottom on anything we send and on anything that arrives,
  // unless the visitor scrolled up by hand in the last few seconds (help * is
  // long and worth reading).
  let lastManualScroll = 0;
  const termEl = document.getElementById('term');
  ['wheel','touchmove'].forEach(ev=>termEl.addEventListener(ev, ()=>{ lastManualScroll=Date.now(); }, {passive:true}));
  function tail(force){ if(force || Date.now()-lastManualScroll > 4000){ try{ term.scrollToBottom(); }catch(_){} } }
  function send(s){ if(ws && ws.readyState===1){ ws.send(s); tail(true); } }
  function doSignon(){
    signonTries++;
    statusEl.textContent = 'signing in\u2026';
    send('signon '+user+',25,user1\r');
  }
  function connect(){
    manualClose=false; signonTries=0; user=newUser();
    ws = new WebSocket('ws://127.0.0.1:7682');
    ws.onopen = ()=>{
      statusEl.textContent='connected'; statusEl.classList.add('on');
      setTimeout(()=>send('\r'), 400);
      setTimeout(doSignon, 900);
    };
    ws.onmessage = (e)=>{
      const data = e.data; term.write(data, ()=>tail(false));
      // self-heal: recover from the two things that strand a visitor
      if(/SIGNON REQUIRED/.test(data) && signonTries < 6){
        setTimeout(doSignon, 300);
      } else if(/DUPLICATE USERNAME/.test(data) && signonTries < 6){
        user=newUser(); setTimeout(doSignon, 300);
      } else if(/OS\/32 TERMINAL MONITOR|^-\s*$/m.test(data)){
        signonTries=0; statusEl.textContent='ready'; statusEl.classList.add('on');
      }
    };
    ws.onclose = ()=>{ if(manualClose) return;
      statusEl.textContent='reconnecting'; statusEl.classList.remove('on');
      setTimeout(connect,1500); };
    ws.onerror = ()=>{ try{ws.close();}catch(_){}; };
  }
  term.onData(d=>send(d));
  connect();

  // ---- Restart: clean line + fresh sign-in, no waiting on OS/32 to reboot ----
  document.getElementById('restart').addEventListener('pointerdown', e=>{
    e.preventDefault();
    cleanupProg(); cur=null; renderMenu();
    setTimeout(()=>{
      try{ send('signoff\r'); }catch(_){}
      manualClose=true; try{ ws.close(); }catch(_){}
      term.reset(); statusEl.textContent='restarting\u2026'; statusEl.classList.remove('on');
      setTimeout(connect, 400);
    }, myProg===null ? 0 : 600);
  });

  // ---- guided lessons -------------------------------------------------
  // Every command below is from the OS/32 kit's own README (EDIT/32, the
  // FORCLG compile-link-go wrapper, DELETE) and was run against the same
  // disk image before shipping. A visitor's program gets a random name
  // (T#### .FTN) and is deleted at the end of the lesson, on Restart, and on
  // leaving - nothing a visitor does here is permanent.
  const lessonEl = document.getElementById('lesson');
  const lTitle = document.getElementById('l-title'), lPos = document.getElementById('l-pos'),
        lBody = document.getElementById('l-body');
  let myProg = null;                       // name of the file this visitor made, if any
  function progName(){ if(!myProg) myProg = 'T' + String(1000 + Math.floor(Math.random()*9000)); return myProg; }

  // typing: one character at a time so the visitor sees it happen
  let typing = false;
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  async function typeLine(line, cps=36){
    for(const ch of line){ send(ch); await sleep(1000/cps); }
    send('\r');
  }
  async function typeLines(lines, gap=350){
    typing = true;
    try{ for(const l of lines){ await typeLine(l); await sleep(gap); } }
    finally{ typing = false; }
  }

  // A lesson is a list of steps. Each step: say (what it means), cmd (lines to type).
  // {P} is replaced by this visitor's program name.
  // FORTRAN VII on this image prints to the terminal with TYPE *, (as the
  // kit's own hellof.ftn does); WRITE(6,*) has no unit 6 and pauses the task.
  const PROGRAM = [
    '      PROGRAM SQUARES',
    "      TYPE *, 'HELLO FROM THE 3280'",
    '      DO 10 I = 1, 10',
    "         TYPE *, I, ' SQUARED IS ', I*I",
    '   10 CONTINUE',
    '      END',
  ];
  const LESSONS = [
    { id:'look', title:'Look around', blurb:'What does a 1985 computer say when you ask it something?',
      steps:[
        { say:'A terminal has <b>no mouse and no windows</b>. You type a command, press return, and the computer answers. Ask it the time.', cmd:['display time'] },
        { say:'Every file on the disk has a short name and a three-letter type. <b>List them.</b>', cmd:['display files'] },
        { say:'The computer will tell you every command it knows. This is a long list &mdash; scroll the screen with a finger.', cmd:['help *'] },
        { say:'That is it. <b>Now try typing something yourself</b> on the keyboard below &mdash; you cannot break anything.', cmd:null },
      ]},
    { id:'run', title:'Run a program', blurb:'Look at a real Fortran program, then compile and run it.',
      steps:[
        { say:'A program is just a text file. <b>Show the one called HELLOF</b> &mdash; it is written in Fortran, the language this machine was built for.', cmd:['type hellof.ftn'] },
        { say:'The computer cannot run text. <b>FORCLG</b> means Fortran: Compile, Link, and Go &mdash; turn it into machine code, then run it.', cmd:['forclg hellof'] },
        { say:'The same trick works in <b>Pascal</b> and in <b>C</b>. Try one.', cmd:['pasclg hellop'] },
        { say:'You just ran a program on a 1985 supermini. <b>Next lesson: write your own.</b>', cmd:null },
      ]},
    { id:'write', title:'Write your own', blurb:'Type a program into the editor, save it, compile it, run it, delete it.',
      steps:[
        { say:'Programs are written in an <b>editor</b>. This one is called EDIT/32. Start it. The <b>&gt;</b> prompt means the editor is listening.', cmd:['l edit32;st'] },
        { say:'Tell the editor to <b>append</b> lines &mdash; add text to the end of an empty file. It numbers each line as you go.', cmd:['a'] },
        { say:'Here is a six-line Fortran program. It says hello, then prints the squares of 1 to 10. <b>Watch it get typed in.</b> An empty line tells the editor you are finished.', code:PROGRAM, cmd:PROGRAM.concat(['']) },
        { say:'<b>Save it</b> under a name of its own, then leave the editor. The name is yours for this visit only.', cmd:['save {P}.ftn','end'] },
        { say:'It is a real file on the disk now. <b>Look it up.</b> Six records, 80 characters each &mdash; one punched card per line.', cmd:['display files,{P}.ftn'] },
        { say:'Now <b>compile, link and go</b> &mdash; the same FORCLG as before, but on your program. Watch the compiler say NO ERROR(S).', cmd:['forclg {P}'] },
        { say:'Did it print the squares? <b>That was your program</b>, running on a real 1980s operating system.', cmd:null },
        { say:'Nothing here is permanent. <b>Delete your program</b> &mdash; the source, the compiled code and the task &mdash; so the next visitor starts clean.', cmd:['delete {P}.ftn','delete {P}.obj','delete {P}.tsk'], cleanup:true },
      ]},
  ];
  let cur = null, stepIdx = 0, stepDone = false;

  function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fill(cmds){ return cmds.map(c=>c.replace(/\{P\}/g, progName())); }

  function renderMenu(){
    cur=null; lTitle.textContent='Lessons'; lPos.textContent='pick one';
    lBody.innerHTML = '<div class="menu">' + LESSONS.map((l,i)=>
      `<button class="btn" data-l="${i}">${l.title}<small>${l.blurb}</small></button>`).join('') +
      `<button class="btn" id="l-close">Close<small>just explore on your own</small></button></div>`;
    lBody.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault(); startLesson(+b.dataset.l);}));
    document.getElementById('l-close').addEventListener('pointerdown',e=>{e.preventDefault(); toggleLessons(false);});
    refit();
  }
  function refit(){ setTimeout(()=>{ try{fit.fit();}catch(_){} tail(true); }, 30); }
  function startLesson(i){ cur=LESSONS[i]; stepIdx=0; renderStep(); }
  function renderStep(){
    const st = cur.steps[stepIdx]; stepDone = !st.cmd;
    lTitle.textContent = cur.title; lPos.textContent = `step ${stepIdx+1} of ${cur.steps.length}`;
    let h = `<div class="say">${st.say}</div>`;
    if(st.code) h += `<div class="code">${esc(st.code.join('\n'))}</div>`;
    h += `<div class="row"><button class="btn" id="l-back">&#8592;</button>`;
    if(st.cmd){
      const shown = fill(st.cmd).filter(c=>c!=='');
      const label = st.code ? 'Type the program for me' : ('Type it: ' + shown.join('  &middot;  '));
      h += `<button class="btn go" id="l-go">${label}</button>`;
    } else {
      h += `<button class="btn go done" id="l-go">Nice.</button>`;
    }
    h += `<button class="btn" id="l-next">${stepIdx+1<cur.steps.length?'Next &#8594;':'Done'}</button></div>`;
    lBody.innerHTML = h;
    document.getElementById('l-back').addEventListener('pointerdown',e=>{e.preventDefault(); if(stepIdx>0){stepIdx--; renderStep();} else renderMenu();});
    document.getElementById('l-next').addEventListener('pointerdown',e=>{e.preventDefault(); if(typing) return;
      if(stepIdx+1<cur.steps.length){stepIdx++; renderStep();} else { renderMenu(); }});
    const go = document.getElementById('l-go');
    if(st.cmd) go.addEventListener('pointerdown', async e=>{
      e.preventDefault(); if(typing) return;
      go.classList.add('busy'); go.textContent='typing…';
      await typeLines(fill(st.cmd));
      if(st.cleanup) myProg=null;
      go.classList.remove('busy'); go.classList.add('done'); go.textContent='Done — look at the screen';
      stepDone = true;
    });
    refit();
  }
  function toggleLessons(open){
    const o = open===undefined ? !lessonEl.classList.contains('open') : open;
    lessonEl.classList.toggle('open', o);
    if(o && !cur) renderMenu();
    refit();
  }
  document.getElementById('lessons').addEventListener('pointerdown', e=>{ e.preventDefault(); toggleLessons(); });
  // nothing permanent: if a visitor walks off mid-lesson, delete their file
  function cleanupProg(){
    if(!myProg) return;
    const p = myProg; myProg = null;
    try{ send('\r'); send('end\r'); send('end\r'); send('cancel\r');
         send('delete '+p+'.ftn\r'); send('delete '+p+'.obj\r'); send('delete '+p+'.tsk\r'); }catch(_){}
  }
  toggleLessons(true);   // open on arrival: the menu is the invitation

  // ---- tappable command hints ----
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('pointerdown', e=>{ e.preventDefault(); send(c.dataset.cmd+'\r'); });
  });

  // ---- on-screen keyboard : conventional layout ----
  // rows of [base, shifted] ; special tokens handled by name
  const ROWS = [
    [['1','!'],['2','@'],['3','#'],['4','$'],['5','%'],['6','^'],['7','&'],['8','*'],
     ['9','('],['0',')'],['-','_'],['=','+'],['BKSP']],
    [['q','Q'],['w','W'],['e','E'],['r','R'],['t','T'],['y','Y'],['u','U'],['i','I'],
     ['o','O'],['p','P'],['/','?']],
    [['a','A'],['s','S'],['d','D'],['f','F'],['g','G'],['h','H'],['j','J'],['k','K'],
     ['l','L'],[';',':'],["'",'"'],['RET']],
    [['SHIFT'],['z','Z'],['x','X'],['c','C'],['v','V'],['b','B'],['n','N'],['m','M'],
     [',','<'],['.','>'],['SHIFT']],
    [['SPACE']],
  ];
  const kbd=document.getElementById('kbd');
  let shift=false; const shiftKeys=[], letterKeys=[];
  function setShift(v){ shift=v; shiftKeys.forEach(k=>k.classList.toggle('on',v));
    letterKeys.forEach(k=>{ k.firstChild.nodeValue = v ? k.dataset.shift : k.dataset.base; });
  }
  ROWS.forEach(row=>{
    const r=document.createElement('div'); r.className='krow';
    row.forEach(spec=>{
      const t=spec[0]; const k=document.createElement('button'); k.className='k';
      if(t==='BKSP'){ k.classList.add('bksp','mod'); k.textContent='⌫'; k.dataset.act='bksp'; }
      else if(t==='RET'){ k.classList.add('ret'); k.textContent='return ↵'; k.dataset.act='ret'; }
      else if(t==='SHIFT'){ k.classList.add('mod'); k.textContent='shift'; k.dataset.act='shift'; shiftKeys.push(k); }
      else if(t==='SPACE'){ k.classList.add('space'); k.textContent='space'; k.dataset.act='space'; }
      else{
        const base=spec[0], sh=spec[1]||spec[0];
        k.dataset.base=base; k.dataset.shift=sh;
        k.appendChild(document.createTextNode(base));
        if(/[a-z]/.test(base)) letterKeys.push(k);
        else if(sh!==base){ const s=document.createElement('span'); s.className='sup'; s.textContent=sh; k.appendChild(s); }
      }
      k.addEventListener('pointerdown', e=>{
        e.preventDefault();
        const a=k.dataset.act;
        if(a==='shift'){ setShift(!shift); return; }
        if(a==='bksp'){ send('\x08'); return; }          // Ctrl-H erases on OS/32
        if(a==='ret'){ send('\r'); return; }
        if(a==='space'){ send(' '); return; }
        send(shift ? k.dataset.shift : k.dataset.base);
        if(shift) setShift(false);                        // one-shot shift
        k.classList.add('hold'); setTimeout(()=>k.classList.remove('hold'),90);
      });
      r.appendChild(k);
    });
    kbd.appendChild(r);
  });
  setTimeout(()=>{ try{fit.fit();}catch(e){} }, 60);

  // ---- leaving: sign off cleanly so the next visitor gets a free line ----
  function signoff(){ cleanupProg(); try{ send('signoff\r'); }catch(_){}; }
  document.getElementById('back').addEventListener('pointerdown', e=>{
    e.preventDefault(); signoff(); setTimeout(()=>location.href='index.html', 400);
  });
  addEventListener('pagehide', signoff);
  ['contextmenu','dragstart','gesturestart'].forEach(ev=>
    document.addEventListener(ev,e=>e.preventDefault()));
  </script>
</body>
</html>
